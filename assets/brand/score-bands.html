<!-- @dsCard group="Colors" viewport="700x150" name="Score bands" subtitle="≥90 green · 50–89 amber · <50 red (Lighthouse thresholds)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px 20px;display:flex;flex-direction:column;gap:14px}.bar{display:flex;height:34px;border-radius:999px;overflow:hidden}.seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}.sc{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="bar"><div class="seg" style="flex:50;background:var(--status-bad)">0–49 · Red</div><div class="seg" style="flex:40;background:var(--status-warn)">50–89 · Amber</div><div class="seg" style="flex:10;background:var(--status-good)">90+</div></div>
<div class="sc"><span>0</span><span>50</span><span>90</span><span>100</span></div>
<span style="font-size:12px;color:var(--text-secondary)">A score of 72 rising 5 points a month is a better position than a flat 80 — always print the baseline date next to the number.</span>
</body></html>
